<div class="save_msg">
    <div class="save_msg_close">
        <img src="./icons/exit.svg" data-action="cancel" alt="Close">
    </div>

    <div class="save_msg_content">
        <img src="./icons/warning.svg" alt="">
        <span>Do you want to save the changes you made to index.ts?</span>
    </div>

    <div class="save_msg_warning">
        <span>Your changes will be lost if you don't save them.</span>
    </div>

    <div class="save_msg_buttons">
        <div class="save_btn" data-action="cancel">Cancel</div>
        <div class="save_btn" data-action="dont-save">Don't Save</div>
        <div class="save_btn" data-action="save" style="background-color: var(--theme-color);">Save</div>
    </div>
</div>

<div class="save_background"></div>
