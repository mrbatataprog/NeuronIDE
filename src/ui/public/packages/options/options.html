<div class="popup file-popup" id="file-popup">
    <div class="selection" id="cut">
        <img class="selection-icon" src="./icons/cut.svg">
        <span class="selection-text">Cut</span>
        <span class="selection-shortcut"></span>
        <span class="selection-shortcut">Ctrl + X</span>
    </div>

    <div class="selection" id="copy">
    <img class="selection-icon" src="./icons/copy.svg">
    <span class="selection-text">Copy</span>
    <span class="selection-shortcut">Ctrl + C</span>
    </div>

    <div class="selection" id="paste" style="opacity: 0.6;">
    <img class="selection-icon" src="./icons/paste.svg">
    <span class="selection-text">Paste</span>
    <span class="selection-shortcut">Ctrl + V</span>
    </div>

    <div class="separator"></div>
    <div class="selection" id="new-file">
    <img class="selection-icon" src="./icons/menu/new_file.svg">
    <span class="selection-text">New File</span>
    </div>
    
    <div class="selection" id="new-folder">
    <img class="selection-icon" src="./icons/menu/add_folder.svg">
    <span class="selection-text">New Folder</span>
    </div>
    

    <div class="separator"></div>
    <div class="selection" id="explorer">
    <img class="selection-icon" src="./icons/menu/explorer.svg">
    <span class="selection-text">Open in Explorer</span>
    </div>

    <div class="selection">
    <img class="selection-icon" src="./icons/terminal.svg">
    <span class="selection-text">Open in new Terminal</span>
    <span class="selection-shortcut">Ctrl + E</span>
    </div>

    <div class="selection" id="new-window">
        <img class="selection-icon" src="./icons/new_window.svg">
        <span class="selection-text">Open in New Window</span>
        <span class="selection-shortcut"></span>
    </div>

    
    <div class="separator"></div>
    <div class="selection">
    <img class="selection-icon" src="./icons/top_search.svg">
    <span class="selection-text">Search directory</span>
    <span class="selection-shortcut">Ctrl + F</span>
    </div>

    <div class="separator"></div>

    <div class="selection" style="opacity: 0.6;">
    <img class="selection-icon" src="./icons/git_history.svg">
    <span class="selection-text">Open Git history</span>
    </div>

    <div class="selection" style="opacity: 0.6;">
    <img class="selection-icon" src="./icons/git_ignore.svg">
    <span class="selection-text">Git Ignore</span>
    </div>

    <div class="selection" style="opacity: 0.6;">
    <img class="selection-icon" src="./icons/commit.svg">
    <span class="selection-text">Git Commit</span>
    </div>

    <div class="separator"></div>
    <div class="selection" id="rename">
    <img class="selection-icon" src="./icons/settings/pen.svg">
    <span class="selection-text">Rename</span>
    <span class="selection-shortcut">Ctrl + ,</span>
    </div>

    <div class="selection" id="delete">
    <img class="selection-icon" src="./icons/delete.svg">
    <span class="selection-text">Delete</span>
    <span class="selection-shortcut">Delete</span>
    </div>

    <div class="separator"></div>

    <div class="selection">
    <img class="selection-icon" src="./icons/tools.svg">
    <span class="selection-text">Settings</span>
    </div>

</div>
