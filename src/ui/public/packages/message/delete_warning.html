<div class="save_msg" id="warning-popup">
    <div class="save_msg_close">
        <img src="./icons/exit.svg" data-action="cancel" alt="Close">
    </div>

    <div class="save_msg_content">
        <img src="./icons/warning.svg" alt="">
        <span>Are you sure you want to delete this file/folder?</span>
    </div>

    <div class="save_msg_warning">
        <span>This may cannot be undone.</span>
    </div>

    <div class="save_msg_buttons">
        <div class="save_btn" id="cancel">Cancel</div>
        <div class="save_btn" id="cancle">No</div>
        <div class="save_btn" id="delete" style="background-color: var(--theme-color);">Yes, Delete</div>
    </div>
</div>

<div class="save_background" id="warning-background"></div>
