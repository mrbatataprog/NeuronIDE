<div class="popup file-popup" id="menu-popup">
    <div class="selection" id="open-file">
        <img class="selection-icon" src="./icons/menu/open_file.svg">
        <span class="selection-text">Open File</span>
        <span class="selection-shortcut">Ctrl + O</span>
    </div>

    <div class="selection" id="open-folder">
        <img class="selection-icon" src="./icons/menu/open_folder.svg">
        <span class="selection-text">Open Folder</span>
        <span class="selection-shortcut">Ctrl + O Ctrl + K</span>
    </div>

    <div class="selection" id="open-recent">
        <img class="selection-icon" src="./icons/menu/explorer.svg">
        <span class="selection-text">Open recent</span>
        <img src="./icons/right_arrow.svg" class="selection-shortcut"></img>
    </div>

    <div class="separator"></div>
    <div class="selection" id="new-file">
        <img class="selection-icon" src="./icons/menu/new_file.svg">
        <span class="selection-text">New File</span>
    </div>

    <div class="selection" id="new-window">
        <img class="selection-icon" src="./icons/menu/new_window.svg">
        <span class="selection-text">New Window</span>
        <span class="selection-shortcut">Ctrl + Shift + O</span>
    </div>
    
    <div class="selection" id="new-workspace" style="opacity: 0.6;">
        <img class="selection-icon" src="./icons/menu/new_workspace.svg">
        <span class="selection-text">New WorkSpace</span>
        <span class="selection-shortcut">Ctrl + Shift + P</span>
    </div>

    <div class="separator"></div>
    <div class="selection" id="duplicate" style="opacity: 0.6;">
        <img class="selection-icon" src="./icons/menu/duplicate_workspace.svg">
        <span class="selection-text">Duplicate WorkSpace</span>
    </div>

    <div class="separator"></div>
    <div class="selection" id="save">
        <img class="selection-icon" src="./icons/menu/save.svg">
        <span class="selection-text">Save</span>
        <span class="selection-shortcut">Ctrl + S</span>
    </div>

    <div class="selection" id="save-as">
        <img class="selection-icon" src="./icons/menu/save_as.svg">
        <span class="selection-text">Save As</span>
        <span class="selection-shortcut">Ctrl + Shift + S</span>
    </div>

    <div class="selection" id="save-all">
        <img class="selection-icon" src="./icons/menu/save_all.svg">
        <span class="selection-text">Save All</span>
        <span class="selection-shortcut">Ctrl + S + K</span>
    </div>

    <div class="separator"></div>

    <div class="selection" style="opacity: 0.6;" id="git-commit">
        <img class="selection-icon" src="./icons/commit.svg">
        <span class="selection-text">Git Commit</span>
    </div>

    <div class="selection" id="close-folder">
        <img class="selection-icon" src="./icons/menu/close_folder.svg">
        <span class="selection-text">Close Folder</span>
        <span class="selection-shortcut">Ctrl + ,</span>
    </div>

    <div class="selection" id="save-exit">
        <img class="selection-icon" src="./icons/menu/exit.svg">
        <span class="selection-text">Save and Exit</span>
        <span class="selection-shortcut">Shift + Alt + F4</span>
    </div>

    <div class="separator"></div>

    <div class="selection" id="exit">
        <img class="selection-icon" src="./icons/menu/exit.svg">
        <span class="selection-text">Exit</span>
        <span class="selection-shortcut">Alt + F4</span>
    </div>

</div>
